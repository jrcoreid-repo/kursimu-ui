name: KursiMu Python syntax

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile kursimu_gui_v2.py session_rules.py tests/test_session_rules.py
      - name: Test strict session workflow
        run: python -m unittest discover -s tests -p 'test_session_rules.py' -v
